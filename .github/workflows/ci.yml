name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, tests and end-to-end evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Unit, API and browser tests
        run: pytest -q
      - name: End-to-end agent evals (fail below 100%)
        run: python -m evals.run_evals --min-pass-rate 1.0
      - name: Publish eval report
        if: always()
        run: cat evals/results.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t webpilot-agent .
