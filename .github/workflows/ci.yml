name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium
      - name: Unit, API, browser and MCP tests with coverage
        run: pytest -q --cov=app --cov=evals --cov-report=term-missing --cov-fail-under=85

  evals:
    name: End-to-end agent evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Run evals with the offline policy (fail below 100%)
        env:
          LLM_PROVIDER: scripted
        run: python -m evals.run_evals --min-pass-rate 1.0
      - name: Publish eval report
        if: always()
        run: cat evals/results.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t webpilot-agent .
      - name: Run the container and complete a real task inside it
        run: |
          docker run -d --name webpilot webpilot-agent
          docker cp scripts/smoke_test.py webpilot:/tmp/smoke_test.py
          docker exec webpilot python /tmp/smoke_test.py
      - name: Container logs
        if: always()
        run: docker logs webpilot
