<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebPilot Agent</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#1b2130;--muted:#667085;--line:#e3e6ee;--accent:#3056d3;--accent-soft:#e8eefc;
--good:#137a4b;--good-soft:#e5f5ec;--warn:#9a5b00;--warn-soft:#fff3dc;--bad:#b42318;--bad-soft:#fdecea}
@media (prefers-color-scheme: dark){:root{--bg:#10131a;--panel:#171b24;--ink:#e7eaf2;--muted:#98a2b3;--line:#2a3040;
--accent:#7c9cff;--accent-soft:#1e2945;--good:#4ade80;--good-soft:#12301f;--warn:#fbbf24;--warn-soft:#33270d;--bad:#f87171;--bad-soft:#3a1616}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 60px}
h1{margin:0;font-size:26px}
.sub{color:var(--muted);margin:4px 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
form{display:flex;gap:8px}
textarea{flex:1;resize:vertical;min-height:52px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:var(--accent-soft);color:var(--accent);font-weight:500;padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.run{margin-top:16px;display:grid;gap:12px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.failed,.pill.error,.pill.rejected,.pill.max_steps,.pill.budget_exceeded{background:var(--bad-soft);color:var(--bad)}
.pill.awaiting_approval{background:var(--warn-soft);color:var(--warn)}
.answer{font-size:16px;border-left:4px solid var(--good);padding:10px 14px;background:var(--good-soft);border-radius:8px}
.answer.bad{border-color:var(--bad);background:var(--bad-soft)}
.approval{border:2px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px}
.approval .btns{display:flex;gap:8px;margin-top:10px}
.approval .no{background:var(--bad)}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
.step img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.step img.big{position:fixed;inset:5vh 5vw;width:90vw;height:90vh;object-fit:contain;background:var(--bg);z-index:9;cursor:zoom-out}
.step .act{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-word}
.step .out{color:var(--muted);font-size:14px}
.step .out.err{color:var(--bad)}
.flag{margin-top:6px;font-size:13px;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:6px}
.meta{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.tokenbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tokenbar input{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:240px}
.err{color:var(--bad);font-size:14px;margin:10px 0 0}
@media (max-width:640px){form{flex-direction:column}.step{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>WebPilot Agent</h1>
  <p class="sub">Describe a task. The agent drives a real browser, step by step, with guardrails and human approval for anything that spends money.</p>

  <div class="panel">
    <form id="f">
      <textarea id="task" placeholder="e.g. Search the Acme store for &quot;running shoes&quot; and tell me which one is the cheapest." required></textarea>
      <button id="go">Run</button>
    </form>
    <div class="examples" id="examples"></div>
    <p class="note" id="mode"></p>
    <div class="tokenbar" id="tokenbar" hidden>
      <label for="token">API token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token from API_KEYS">
      <button class="ghost" type="button" id="saveToken">Save</button>
    </div>
    <p class="err" id="err" hidden></p>
  </div>

  <section class="run" id="run" hidden>
    <div class="panel">
      <div class="head"><b id="rtask"></b><span class="pill" id="rstatus"></span><span class="meta" id="rmeta"></span></div>
    </div>
    <div id="approval"></div>
    <div id="answer"></div>
    <div class="panel steps" id="steps"></div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
